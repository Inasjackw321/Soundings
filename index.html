<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Soundings Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="unified-container">
        <!-- Top Control Bar -->
        <div class="top-controls">
            <div class="control-section">
                <label>Station</label>
                <select id="station-select" class="control-input"></select>
            </div>
            <div class="control-section">
                <label>Date</label>
                <input type="date" id="date-input" class="control-input">
            </div>
            <div class="control-section">
                <label>Time (UTC)</label>
                <select id="hour-select" class="control-input">
                    <option value="00">00Z</option>
                    <option value="12" selected>12Z</option>
                </select>
            </div>
            <div class="control-section">
                <label>Data Source</label>
                <select id="data-source-select" class="control-input">
                    <option value="iowa-state" selected>Iowa State (NWS/SPC)</option>
                    <option value="uwyo">U. Wyoming</option>
                    <option value="spc">SPC Direct</option>
                </select>
            </div>
            <button id="fetch-btn" class="load-button">Load Sounding</button>
            <div class="control-section station-info-compact">
                <div id="station-name-display">Select Station</div>
                <div id="station-coords-display"></div>
            </div>
            <div class="spacer"></div>
            <button id="save-pdf" class="icon-button" title="Save Comprehensive PDF">PDF</button>
            <button id="save-json" class="icon-button" title="Save JSON">JSON</button>
            <button id="save-csv" class="icon-button" title="Save CSV">CSV</button>
            <button id="save-png" class="icon-button" title="Save PNG">PNG</button>
        </div>

        <!-- Main Content Area -->
        <div class="content-grid">
            <!-- Left Column: Map & Parameters -->
            <div class="left-column">
                <!-- Station Map -->
                <div class="map-card">
                    <div class="card-title">Station Selection</div>
                    <div id="map" class="compact-map"></div>
                </div>

                <!-- RainViewer Radar -->
                <div class="radar-card">
                    <div class="card-title">
                        <span>RainViewer Radar</span>
                        <div class="radar-controls-inline">
                            <button id="radar-play" class="mini-button">▶</button>
                            <input type="range" id="radar-slider" class="radar-slider" min="0" max="11" value="11">
                            <span id="radar-time" class="radar-time-label">Current</span>
                        </div>
                    </div>
                    <div id="radar-map" class="radar-map"></div>
                </div>

                <!-- Hodograph -->
                <div class="hodograph-card">
                    <div class="card-title">Hodograph</div>
                    <div class="hodograph-container">
                        <canvas id="hodograph-canvas"></canvas>
                    </div>
                </div>

                <!-- NWS Alerts -->
                <div class="alerts-card">
                    <div class="card-title">Active Alerts</div>
                    <div id="nws-alerts-compact" class="alerts-compact"></div>
                </div>
            </div>

            <!-- Center Column: Skew-T Diagram -->
            <div class="center-column">
                <div class="diagram-card">
                    <div class="diagram-title-bar">
                        <h2 id="diagram-title">Skew-T Log-P Diagram</h2>
                        <div id="diagram-subtitle"></div>
                    </div>
                    <canvas id="skewt-canvas"></canvas>
                </div>
            </div>

            <!-- Right Column: Severe Wx & Data -->
            <div class="right-column">
                <!-- Severe Weather Analysis -->
                <div class="severe-wx-card">
                    <div class="card-title">Severe Weather Analysis</div>
                    <div id="severe-wx-grid" class="severe-wx-grid"></div>
                </div>

                <!-- Basic Parameters -->
                <div class="params-card">
                    <div class="card-title">Atmospheric Indices</div>
                    <div id="parameters-grid" class="params-grid"></div>
                </div>

                <!-- Sounding Data Table -->
                <div class="data-card">
                    <div class="card-title">Sounding Data</div>
                    <div class="data-table-compact">
                        <table id="sounding-table-compact" class="compact-table">
                            <thead>
                                <tr>
                                    <th>P<br><span class="unit">mb</span></th>
                                    <th>Z<br><span class="unit">m</span></th>
                                    <th>T<br><span class="unit">°C</span></th>
                                    <th>Td<br><span class="unit">°C</span></th>
                                    <th>RH<br><span class="unit">%</span></th>
                                    <th>Dir<br><span class="unit">°</span></th>
                                    <th>Spd<br><span class="unit">kt</span></th>
                                </tr>
                            </thead>
                            <tbody id="sounding-table-body">
                                <tr><td colspan="7" class="no-data">No data loaded</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Current Observations -->
                <div class="obs-card">
                    <div class="card-title">Current Observations</div>
                    <div id="current-obs-compact" class="obs-compact"></div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="stations.js"></script>
    <script src="hodograph.js"></script>
    <script src="skewt.js"></script>
    <script src="sounding.js"></script>
    <script src="nws-data.js"></script>
    <script src="rainviewer.js"></script>
    <script src="nws.js"></script>
    <script src="save.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>
</body>
</html>
